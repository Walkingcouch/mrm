<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="referrer" content="no-referrer">
<title>Document</title>
<style>
  html, body { margin: 0; background: #e9ecef; font-family: -apple-system, Roboto, "Segoe UI", sans-serif; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 72px; }
  canvas { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); max-width: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
            padding: 24px; color: #1f2328; font-size: 16px; background: #fff; }
  #zoom { position: fixed; right: 12px; bottom: 16px; display: flex; gap: 8px; }
  #zoom button { width: 48px; height: 48px; border-radius: 24px; border: 0; background: #00807a; color: #fff;
                 font-size: 24px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  #zoom[hidden], #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="status" role="status">Loading document…</div>
<div id="pages"></div>
<div id="zoom" hidden>
  <button id="out" aria-label="Zoom out">−</button>
  <button id="in" aria-label="Zoom in">+</button>
</div>
<script type="module">
  // Only files from this project's public storage may be shown here. The
  // allowed prefix is injected at build time via /pdf-viewer/config.js.
  import { ALLOWED_PREFIX } from './config.js';
  import * as pdfjsLib from './lib/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.mjs';

  const status = document.getElementById('status');
  const pages = document.getElementById('pages');
  const zoomBar = document.getElementById('zoom');
  const fail = (msg) => { status.textContent = msg; status.hidden = false; zoomBar.hidden = true; };

  const params = new URLSearchParams(location.search);
  const file = params.get('file') || '';

  // local=1: the app already has this document cached on the phone and hands
  // the bytes over (window.__mrmPdfData, injected by the app itself). If they
  // do not arrive within a few seconds, the document loads from its URL.
  const localBytes = () => new Promise((resolve) => {
    if (params.get('local') !== '1') return resolve(null);
    let done = false;
    const take = () => {
      if (done || typeof window.__mrmPdfData !== 'string') return;
      done = true;
      try {
        const bin = atob(window.__mrmPdfData);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(bytes);
      } catch { resolve(null); }
      window.__mrmPdfData = undefined;
    };
    window.__mrmLoadPdf = take;
    take();
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 4000);
  });
  if (!ALLOWED_PREFIX || !file.startsWith(ALLOWED_PREFIX) || file.includes('..')) {
    fail('This document cannot be shown.');
  } else {
    let doc, zoom = 1, rendering = false;
    const render = async () => {
      if (rendering) return; rendering = true;
      pages.textContent = '';
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const cssWidth = Math.min(document.documentElement.clientWidth - 16, 1000) * zoom;
      for (let n = 1; n <= doc.numPages; n++) {
        const page = await doc.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const scale = cssWidth / base.width;
        const vp = page.getViewport({ scale: scale * dpr });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
        canvas.style.width = `${Math.floor(vp.width / dpr)}px`;
        canvas.style.height = `${Math.floor(vp.height / dpr)}px`;
        canvas.setAttribute('aria-label', `Page ${n} of ${doc.numPages}`);
        pages.appendChild(canvas);
        await page.render({ canvas, viewport: vp }).promise;
      }
      rendering = false;
    };
    try {
      const data = await localBytes();
      try {
        doc = await pdfjsLib.getDocument(data ? { data, isEvalSupported: false } : { url: file, isEvalSupported: false }).promise;
      } catch (e) {
        if (!data) throw e;
        doc = await pdfjsLib.getDocument({ url: file, isEvalSupported: false }).promise; // bad local copy
      }
      status.hidden = true; zoomBar.hidden = false;
      await render();
      document.getElementById('in').onclick = () => { zoom = Math.min(zoom * 1.25, 4); render(); };
      document.getElementById('out').onclick = () => { zoom = Math.max(zoom / 1.25, 1); render(); };
    } catch (e) {
      const missing = e && (e.name === 'MissingPDFException' || e.status === 404 || e.status === 400);
      const invalid = e && e.name === 'InvalidPDFException';
      fail(missing ? 'This document is no longer available.'
         : invalid ? 'This file could not be opened as a PDF.'
         : 'Could not load the document. Check your connection and try again.');
    }
  }
</script>
</body>
</html>
